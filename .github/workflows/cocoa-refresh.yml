name: Cocoa Intelligence Hub - Automatic Refresh

on:
  schedule:
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install production refresh dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Ensure ensemble results table exists
          env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
          run: |
            python -c 'import os, psycopg2; conn = psycopg2.connect(os.environ["DATABASE_URL"]); cur = conn.cursor(); cur.execute("CREATE TABLE IF NOT EXISTS ensemble_results (horizon TEXT PRIMARY KEY, latest_date DATE NOT NULL, result JSONB NOT NULL, updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW());"); conn.commit(); cur.close(); conn.close(); print("ensemble_results table is ready.")'

 - name: Run official ICCO + ML refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python backend/refresh_pipeline.py
