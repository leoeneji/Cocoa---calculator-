name: Cocoa Intelligence Hub - Automatic Refresh

on:
  schedule:
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install production refresh dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy \
            pandas \
            psycopg2-binary \
            psycopg[binary]\
            python-dotenv \
            requests \
            beautifulsoup4 \
            lxml \
            scikit-learn \
            xgboost \
            statsmodels

      - name: Run official ICCO + ML refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python backend/refresh_pipeline.py
